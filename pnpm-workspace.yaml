overrides:
  "brace-expansion@^2.0.0": 2.1.7
  "brace-expansion@^5.0.0": 5.0.12
  fast-uri: 4.2.2
  glob: 13.0.6

# @msw/cloudflare exige MSW 3; o mocker opcional do Vitest ainda declara MSW 2.
peerDependencyRules:
  allowedVersions:
    msw: ">=3"

# Binários usados pelo build Vite e pelo runtime de testes Cloudflare.
allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20261011.1'

onlyBuiltDependencies:
  - esbuild
  - workerd
